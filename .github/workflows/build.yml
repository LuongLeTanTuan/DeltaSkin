name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: ubuntu-latest
    container: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain inventory
        run: |
          echo "== theos =="; ls -d /opt/theos 2>/dev/null || true
          echo "== sdks ==";   ls /opt/theos/sdks 2>/dev/null | head || true
          echo "== toolchain =="; ls /opt/theos/toolchain 2>/dev/null || true
          echo "== clang =="; find / -maxdepth 6 -name 'clang++' -type f 2>/dev/null | head -5 || true

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          THEOS="${THEOS:-/opt/theos}"
          CLANG=$(find "$THEOS/toolchain" /usr -name 'clang++' -type f 2>/dev/null | head -1)
          test -n "$CLANG" || { echo "no clang++"; exit 1; }
          SDK=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk 2>/dev/null | sort -V | tail -1)
          test -n "$SDK" || { echo "no iOS SDK"; exit 1; }
          echo "clang=$CLANG"; echo "sdk=$SDK"
          mkdir -p build
          "$CLANG" -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -fobjc-arc -O2 -fmodules -F"$SDK/System/Library/Frameworks" \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -dynamiclib -o build/DeltaSkin.dylib src/DeltaSkin.mm
          file build/DeltaSkin.dylib
          ls -l build/DeltaSkin.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaSkin-dylib
          path: build/DeltaSkin.dylib

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DeltaSkin.dylib
