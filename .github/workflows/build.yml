name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -dynamiclib -o build/DeltaSkin.dylib src/DeltaSkin.mm
          file build/DeltaSkin.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaSkin-dylib
          path: build/DeltaSkin.dylib

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DeltaSkin.dylib
