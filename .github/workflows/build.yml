name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld unzip curl

      - name: Fetch iPhoneOS SDK
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          ls /tmp/sdks
          echo "SDK=$(ls -d /tmp/sdks/sdks-master/iPhoneOS*.sdk | sort -V | tail -1)" >> $GITHUB_ENV

      - name: Compile
        run: |
          set -euo pipefail
          echo "SDK=$SDK"
          mkdir -p build
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
                -fobjc-arc -O2 -I src \
                -c src/DeltaSkin.mm -o build/DeltaSkin.o
          ls -l build

      - name: Link
        run: |
          set -euo pipefail
          ld64.lld -arch arm64 -platform_version ios 14.0 14.0 \
            -dylib -syslibroot "$SDK" \
            -o build/DeltaSkin.dylib build/DeltaSkin.o \
            -F"$SDK/System/Library/Frameworks" -L"$SDK/usr/lib" \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -undefined dynamic_lookup
          file build/DeltaSkin.dylib
          ls -l build/DeltaSkin.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaSkin-dylib
          path: build/DeltaSkin.dylib

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DeltaSkin.dylib
